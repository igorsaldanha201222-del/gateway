# Gera os executaveis e publica no release.
#
# Dispara ao empurrar uma tag v* (ex.: git tag v1.0.0 && git push origin v1.0.0),
# ou manualmente pela aba Actions.
#
# O atualizar.ps1 do PC da usina consome gridco-gateway.exe e o .sha256 daqui.
# Sem o .sha256 ele se recusa a trocar o binario.

name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # O gateway em si e' so' biblioteca padrao. As dependencias abaixo sao de
      # empacotamento: pyinstaller; tzdata porque o Windows nao tem base de
      # fusos do sistema; pywin32 para o servico falar com o SCM.
      - name: Dependencias de build
        run: python -m pip install --upgrade pip pyinstaller tzdata pywin32

      # Certificado e chave da frota. Vao DENTRO do .exe, para que o gateway ja
      # saia de fabrica falando com o broker - sem importar nada em 200 usinas.
      #
      # A chave nao esta no repositorio, que e publico: vem destes dois secrets,
      # em base64. Cadastrar uma vez em Settings > Secrets and variables >
      # Actions, com os nomes FROTA_CRT e FROTA_KEY.
      #
      # Fique claro o que isto custa: o release e publico, e quem baixar o .exe
      # consegue extrair a chave. Ela e a mesma para a frota inteira, entao vale
      # por todas as usinas. Foi decisao de operacao, para nao ter par para
      # emitir e distribuir por usina. Se um dia essa conta virar, o caminho e
      # um certificado por usina - ja ha script e ACL prontos em deploy/broker.
      - name: Credencial da frota
        env:
          FROTA_CRT: ${{ secrets.FROTA_CRT }}
          FROTA_KEY: ${{ secrets.FROTA_KEY }}
        run: |
          # Aceita o secret em base64 OU colado como PEM direto: quem cadastra
          # copia de um arquivo, e exigir um formato so' e pedir para falhar.
          # Espaco e quebra de linha vao junto na colagem e quebram o
          # FromBase64String - por isso a limpeza antes.
          function Gravar($texto, $arquivo, $rotulo) {
            if ([string]::IsNullOrWhiteSpace($texto)) {
              throw "Secret $rotulo vazio ou ausente. Sem ele o .exe sairia sem credencial e nenhuma usina conectaria."
            }
            if ($texto -match "-----BEGIN") {
              [IO.File]::WriteAllText($arquivo, $texto.Trim() + "`n")
              Write-Host "$rotulo veio como PEM."
              return
            }
            $limpo = ($texto -replace "\s", "")
            try { $bytes = [Convert]::FromBase64String($limpo) }
            catch { throw "Secret $rotulo nao e base64 valido nem PEM. Recadastre copiando o arquivo inteiro." }
            [IO.File]::WriteAllBytes($arquivo, $bytes)
            Write-Host "$rotulo veio em base64 ($($bytes.Length) bytes)."
          }
          Gravar $env:FROTA_CRT "config/frota.crt" "FROTA_CRT"
          Gravar $env:FROTA_KEY "config/frota.key" "FROTA_KEY"

          if ((Get-Content config/frota.crt -Raw) -notmatch "BEGIN CERTIFICATE") {
            throw "config/frota.crt nao e um certificado PEM."
          }
          if ((Get-Content config/frota.key -Raw) -notmatch "BEGIN.*PRIVATE KEY") {
            throw "config/frota.key nao e uma chave PEM."
          }
          # Confere que a chave casa com o certificado. E a unica verificacao
          # que pega par trocado; sem ela o build passa e 200 usinas nao
          # conectam. Em Python para nao depender de openssl no runner.
          python -c "import ssl; ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT).load_cert_chain('config/frota.crt','config/frota.key'); print('certificado e chave conferem')"

      - name: Testes
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests

      - name: Validar a configuracao base
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m gridco_gateway --config config/gateway.json --validate

      - name: Empacotar o servico
        run: python -m PyInstaller deploy/windows/gridco-gateway.spec --noconfirm --clean --distpath dist --workpath build/pyinstaller

      - name: Empacotar o console
        run: python -m PyInstaller deploy/windows/gridco-console.spec --noconfirm --clean --distpath dist --workpath build/pyinstaller

      # Prova de vida fora do ambiente Python: se o binario nao validar a
      # configuracao, nao adianta publicar.
      - name: Conferir o servico
        run: |
          ./dist/gridco-gateway.exe --version
          ./dist/gridco-gateway.exe --config config/gateway.json --validate

      # O proprio atualizador vai no release: sem isso, melhoria no script de
      # atualizacao exigiria levar arquivo a mao ate cada usina - justamente o
      # que a atualizacao automatica existe para evitar.
      - name: Publicar o atualizador junto
        run: Copy-Item deploy/windows/atualizar.ps1 dist/atualizar.ps1 -Force

      - name: Somas de verificacao
        run: |
          foreach ($nome in @("gridco-gateway.exe", "gridco-console.exe", "atualizar.ps1")) {
            $h = (Get-FileHash "dist/$nome" -Algorithm SHA256).Hash.ToLower()
            "$h  $nome" | Out-File -FilePath "dist/$nome.sha256" -Encoding ascii
            Write-Host "$nome  $h"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: gridco-windows
          path: |
            dist/gridco-gateway.exe
            dist/gridco-gateway.exe.sha256
            dist/gridco-console.exe
            dist/gridco-console.exe.sha256
            dist/atualizar.ps1
            dist/atualizar.ps1.sha256

      - name: Publicar no release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gridco-gateway.exe
            dist/gridco-gateway.exe.sha256
            dist/gridco-console.exe
            dist/gridco-console.exe.sha256
            dist/atualizar.ps1
            dist/atualizar.ps1.sha256
