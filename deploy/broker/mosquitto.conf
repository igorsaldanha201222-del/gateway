# Broker Grid Co - dois listeners.
#
# 1883 continua limpo, para o que ja usa ele hoje.
# 8883 e TLS, que e por onde o gateway fala.
#
# Migrar sem derrubar nada: sobe o 8883 ao lado, move os gateways, e so depois
# fecha o 1883. Senha em 1883 vai em texto claro - so serve dentro de rede
# confiavel, nunca pela internet.
#
# __BASE__ e __DADOS__ sao trocados por subir-broker.ps1. No servidor Linux,
# troque a mao por /etc/mosquitto e /var/lib/mosquitto.

per_listener_settings true

# --------------------------------------------------------------------------
# 1883 - MQTT limpo, so na rede interna
# --------------------------------------------------------------------------
listener 1883
protocol mqtt
listener_allow_anonymous false
password_file __BASE__/senhas.txt

# --------------------------------------------------------------------------
# 8883 - MQTT sobre TLS, por onde os 200 gateways publicam
# --------------------------------------------------------------------------
listener 8883
protocol mqtt

cafile   __BASE__/certificados/ca.crt
certfile __BASE__/certificados/broker.crt
keyfile  __BASE__/certificados/broker.key

# TLS 1.2 no minimo. O gateway usa o ssl da biblioteca padrao do Python.
tls_version tlsv1.2

# mTLS: quem conecta na 8883 tem de apresentar certificado assinado pela nossa
# CA. Sem senha nenhuma - o certificado E a credencial, como era no IOT2050 V3.
require_certificate true

# O CN do certificado do cliente vira o nome de usuario. E o que faz a ACL
# separar usina por usina: o certificado da 'acopiara' so escreve no topico da
# acopiara, e um certificado vazado nao alcanca as outras 199.
use_identity_as_username true

# Sem password_file aqui de proposito: com use_identity_as_username o mosquitto
# recusaria a conexao por nao achar o usuario na lista de senhas.
listener_allow_anonymous false
acl_file __BASE__/acl.txt

# --------------------------------------------------------------------------
# Persistencia e log
#
# Ficam FORA da pasta do projeto: o servico roda como LocalSystem e precisa de
# lugar onde possa escrever sempre. Em pasta de repositorio ele falha calado.
# --------------------------------------------------------------------------
persistence true
persistence_location __DADOS__/
autosave_interval 60

log_dest file __DADOS__/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Fila por cliente desconectado. O buffer local do gateway continua sendo a
# garantia de verdade; isto so ajuda no repique curto.
max_queued_messages 10000
max_packet_size 262144
